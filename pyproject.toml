[project]
name = "mcp-superset-sso"
version = "0.4.0"
description = "MCP server for Apache Superset that acts as the signed-in SSO user (fork of bintocher/mcp-superset)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Stanislav Chernov", email = "bintocher@gmail.com" },
]
keywords = [
    "mcp",
    "superset",
    "apache-superset",
    "model-context-protocol",
    "dashboards",
    "analytics",
    "bi",
    "llm",
    "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "twine>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/AliakseiAliaksandrau/mcp-superset-sso"
Repository = "https://github.com/AliakseiAliaksandrau/mcp-superset-sso"
Issues = "https://github.com/AliakseiAliaksandrau/mcp-superset-sso/issues"
Upstream = "https://github.com/bintocher/mcp-superset"

[project.scripts]
mcp-superset = "mcp_superset.__main__:main"
mcp-superset-selftest = "mcp_superset.selftest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_superset"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
